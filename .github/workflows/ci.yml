name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # A job of its own rather than a step in `verify`, for two reasons. It needs
  # `next dev`, not the build, so it has nothing to wait for and does not queue
  # behind it. And a red tick here means "a behaviour broke", which is a
  # different message from a red `verify`; folded in as a step, the two would be
  # indistinguishable from the checks list.
  #
  # It does not come free: this job is the slower of the two, so it becomes the
  # pipeline's critical path. ~42s -> 1m2s warm, 1m15s on a cold browser cache,
  # of which 29s is the suite. Parallelism buys back `verify`'s time, not this
  # job's own.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser is the one prerequisite `npm ci` does not bring, and it is
      # ~130MB. Keyed on the lockfile so it is re-downloaded when the Playwright
      # version moves and not before.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts and stops `next dev` itself — see `webServer` in
      # playwright.config.ts. There is no server to start here.
      - name: E2E
        run: npm run test:e2e

      # The suite runs with no retries on purpose, so this report and the traces
      # inside it are the only forensics a CI-only failure leaves behind.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
